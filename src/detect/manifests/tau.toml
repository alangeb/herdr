id = "tau"
version = "2025.07.10.2"
min_engine_version = 1
updated_at = "2025-07-10T00:00:00Z"
aliases = ["tau", "tauergon", "tau-ergon"]

# Tau is screen-state authoritative. The Tau/TauRLM integration may publish a
# session id for resume identity, but it must not drive the Herdr pane state.
# Tau's prompt is `>>>`; an active turn appends `[RUNNING]`, and typed suffix
# text is still an idle prompt waiting for the next operator turn.

[[rules]]
id = "prompt_running_tau"
state = "working"
priority = 1050
region = "bottom_non_empty_lines(3)"
visible_working = true
line_regex = ['(?i)^\s*>{2,}\s+\[RUNNING\](?:\s.*)?$']

[[rules]]
id = "blocked_input_request"
state = "blocked"
priority = 1100
region = "bottom_non_empty_lines(5)"
visible_blocker = true
regex = [
  '(?i)\b(awaiting user input|waiting for user input|waiting for input|input required|double-call confirmation|path rejected|exact same call again|eot confirmation)\b',
]
not = [
  { line_regex = ['^\s*[|]'] },
  { line_regex = ['^\s*(?:\$|>{2,})(?:\s.*)?$'] },
]

[[rules]]
id = "idle_prompt_tau"
state = "idle"
priority = 90
region = "bottom_non_empty_lines(3)"
visible_idle = true
line_regex = ['(?i)^\s*(?:\$|>{2,})(?:\s.*)?$']

[[rules]]
id = "working_bottom_output"
state = "working"
priority = 60
region = "bottom_non_empty_lines(8)"
visible_working = true
line_regex = ['\S']

[[rules]]
id = "no_live_state_evidence"
state = "unknown"
priority = 0
region = "whole_recent"
regex = ['(?s)^.*$']
