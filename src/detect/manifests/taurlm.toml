id = "taurlm"
version = "2025.07.10.2"
min_engine_version = 1
updated_at = "2025-07-10T00:00:00Z"
aliases = ["taurlm", "tau-rlm"]

# TauRLM is screen-state authoritative. TauRLM's lifecycle hooks are session
# identity only: they can carry A2A session id/metadata, but they must not own
# the pane dot. TauRLM's idle prompt is `rlm[ctx]>>>` or `>>>` with optional
# suffix; active turns append `[RUNNING]`.

[[rules]]
id = "osc_progress_blocked"
state = "blocked"
priority = 1400
region = "osc_progress"
visible_blocker = true
regex = ['^4;3(?:;|$)']

[[rules]]
id = "prompt_running_taurlm"
state = "working"
priority = 1050
region = "bottom_non_empty_lines(3)"
visible_working = true
line_regex = ['(?i)^\s*(?:\$|rlm\[[0-9]+\]>{2,})\s+\[RUNNING\](?:\s.*)?$']

[[rules]]
id = "blocked_input_request"
state = "blocked"
priority = 1000
region = "bottom_non_empty_lines(5)"
visible_blocker = true
regex = [
  '(?i)\b(awaiting user input|waiting for user input|waiting for input|input required|needs (input|confirmation|approval))\b',
]
not = [
  { line_regex = ['^\s*[|]'] },
  { line_regex = ['(?i)^\s*(?:\$|rlm\[[0-9]+\]>>+|>{2,})(?:\s.*)?$'] },
]

[[rules]]
id = "working_executing"
state = "working"
priority = 900
region = "bottom_non_empty_lines(12)"
visible_working = true
regex = ['(?i)\b(running|executing|processing|evaluating|computing|compiling|building)\b.*\.{2,}']

[[rules]]
id = "working_repl_output"
state = "working"
priority = 850
region = "bottom_non_empty_lines(10)"
visible_working = true
line_regex = [
  '^(?:Running|Executing|Evaluating|Processing)\b.*$',
]

[[rules]]
id = "idle_prompt_taurlm"
state = "idle"
priority = 90
region = "bottom_non_empty_lines(3)"
visible_idle = true
line_regex = ['(?i)^\s*(?:\$|rlm\[[0-9]+\]>{2,}|>{2,})(?:\s.*)?$']

[[rules]]
id = "working_bottom_output"
state = "working"
priority = 60
region = "bottom_non_empty_lines(8)"
visible_working = true
line_regex = ['\S']

[[rules]]
id = "no_live_state_evidence"
state = "unknown"
priority = 0
region = "whole_recent"
regex = ['(?s)^.*$']
